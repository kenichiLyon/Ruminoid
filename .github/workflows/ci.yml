name: CI

on:
  push:
  pull_request:
    branches:
      - '*'

jobs:
  ci_build:
    name: Build
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Checkout Submodules
      shell: bash
      run: |
        auth_header="$(git config --local --get http.https://github.com/.extraheader)"
        git submodule sync --recursive
        git -c "http.extraheader=$auth_header" -c protocol.version=2 submodule update --init --force --recursive --depth=1

    - name: Install .NET Framework Developer Pack
      run: |
        choco install netfx-4.8-devpack --force

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Restore NuGet Packages
      run: nuget restore Ruminoid.sln

    - name: Prepare MSBuild
      uses: microsoft/setup-msbuild@v1.1.0

    - name: Build Solution
      run: msbuild Ruminoid.sln /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
